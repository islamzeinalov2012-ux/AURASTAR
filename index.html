
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA STAR — Beyond the Future</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#080b20;
 --panel:#101632;
 --blue:#3988ff;
 --purple:#8b5cf6;
 --text:#f4f5ff;
 --muted:#aab2d0;
}
body{
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 overflow-x:hidden;
 line-height:1.65;
}
body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-2;
 background:
 radial-gradient(ellipse at 15% 10%,#243b8a55,transparent 40%),
 radial-gradient(ellipse at 85% 40%,#7025a844,transparent 40%),
 linear-gradient(150deg,#080b20,#10102b 60%,#080b20);
}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
button{cursor:pointer}
.container{width:min(1180px,92%);margin:auto}

/* HEADER */
header{
 position:sticky;
 top:0;
 z-index:100;
 background:#080b20ed;
 backdrop-filter:blur(18px);
 border-bottom:1px solid #ffffff12;
}
.nav{
 min-height:78px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
}
.brand{
 display:flex;
 align-items:center;
 gap:12px;
 font-size:23px;
 font-weight:900;
 letter-spacing:3px;
 white-space:nowrap;
}
.logo{
 width:43px;height:43px;
 filter:drop-shadow(0 0 12px #548dff99);
}
.brand span{color:#78a7ff}
.navlinks{
 display:flex;
 align-items:center;
 gap:23px;
}
.navlinks a{
 font-size:13px;
 color:#c9cce4;
 transition:.2s;
}
.navlinks a:hover{color:#83aaff}
.controls{display:flex;align-items:center;gap:12px}
#language{
 background:#151b3b;
 color:white;
 border:1px solid #5667a5;
 padding:10px;
 border-radius:10px;
 max-width:145px;
}
.menu-btn{
 display:none;
 background:#202957;
 color:white;
 border:0;
 border-radius:10px;
 padding:10px 14px;
 font-size:20px;
}
.mobile-menu{
 display:none;
 position:fixed;
 z-index:150;
 top:78px;
 left:0;right:0;
 padding:22px;
 background:#0d1230;
 border-bottom:1px solid #5266b9;
 box-shadow:0 20px 50px #0009;
}
.mobile-menu.open{display:grid;gap:15px}
.mobile-menu a{
 padding:12px;
 border-radius:9px;
 background:#ffffff08;
}
.close-menu{
 position:absolute;
 right:20px;
 top:15px;
 border:0;
 background:transparent;
 color:white;
 font-size:24px;
}

/* GENERAL */
section{padding:90px 0;scroll-margin-top:90px}
.section-title{
 font-size:clamp(29px,5vw,43px);
 margin-bottom:14px;
 line-height:1.2;
}
.section-desc{
 color:var(--muted);
 max-width:750px;
 margin-bottom:35px;
}
.gradient{
 background:linear-gradient(90deg,#55a5ff,#ae7aff);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}
.card{
 background:linear-gradient(145deg,#18234bba,#10142dbb);
 border:1px solid #829aff20;
 border-radius:19px;
 padding:27px;
 transition:.25s;
}
.card:hover{
 transform:translateY(-5px);
 border-color:#7599ff88;
 box-shadow:0 15px 40px #244caa22;
}
.grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:20px;
}
.card-icon{
 font-size:34px;
 margin-bottom:14px;
}
.card h3{font-size:21px;margin-bottom:12px}
.card p{color:var(--muted);font-size:14px}
.tag{
 display:inline-block;
 margin-top:18px;
 padding:6px 12px;
 border-radius:20px;
 background:#4269d52c;
 color:#9bbcff;
 font-size:12px;
}

/* HERO */
.hero{
 min-height:650px;
 display:flex;
 align-items:center;
 padding:95px 0;
}
.hero-content{max-width:850px}
.eyebrow{
 color:#8cb3ff;
 letter-spacing:4px;
 font-size:12px;
 font-weight:bold;
 margin-bottom:23px;
}
.hero h1{
 font-size:clamp(48px,8vw,90px);
 line-height:1.08;
 letter-spacing:-3px;
 margin-bottom:25px;
}
.hero p{
 color:#b6bedc;
 font-size:18px;
 max-width:680px;
 margin-bottom:32px;
}
.buttons{display:flex;flex-wrap:wrap;gap:13px}
.btn{
 display:inline-flex;
 justify-content:center;
 align-items:center;
 border:1px solid #698cff66;
 padding:13px 23px;
 border-radius:11px;
 color:white;
 background:linear-gradient(110deg,#286de5,#7545cf);
 font-weight:bold;
}
.btn.secondary{background:#ffffff0b}
.hero-decoration{
 position:absolute;
 right:7%;
 top:190px;
 width:180px;
 height:180px;
 border:1px solid #739bff55;
 border-radius:50%;
 box-shadow:0 0 60px #516dff44,inset 0 0 60px #516dff22;
}
.hero-decoration:before{
 content:"";
 position:absolute;
 inset:22px;
 border:1px solid #a17aff88;
 border-radius:50%;
}
.hero-decoration:after{
 content:"✦";
 position:absolute;
 inset:0;
 display:grid;
 place-items:center;
 font-size:80px;
 color:#94baff;
 text-shadow:0 0 35px #548dff;
}

/* STATS */
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px;
 margin-top:55px;
}
.stat{
 padding:23px;
 background:#ffffff08;
 border:1px solid #ffffff13;
 border-radius:15px;
}
.stat strong{font-size:30px;display:block;color:#8eb3ff}
.stat span{font-size:13px;color:var(--muted)}

/* LARGE FEATURE */
.feature{
 display:grid;
 grid-template-columns:1.1fr .9fr;
 gap:30px;
 align-items:center;
}
.feature-art{
 min-height:330px;
 border-radius:24px;
 border:1px solid #718bff33;
 background:
 radial-gradient(circle at 50% 50%,#7b62ff55,transparent 42%),
 linear-gradient(135deg,#162d63,#171033);
 display:grid;
 place-items:center;
 font-size:110px;
}

/* NEWS */
.news-date{font-size:12px;color:#91aaff;margin-bottom:10px}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

/* CONTACT */
.contact-box{
 background:linear-gradient(110deg,#1c3470,#30205a);
 padding:45px;
 border-radius:23px;
 border:1px solid #ffffff22;
}
footer{
 padding:35px 0;
 border-top:1px solid #ffffff15;
 color:#929bbd;
 font-size:13px;
}
.footer-inner{
 display:flex;
 justify-content:space-between;
 flex-wrap:wrap;
 gap:20px;
}

/* ANIMATIONS */
@keyframes appear{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}
section{animation:appear .5s ease both}

/* RTL */
body.rtl{direction:rtl}
body.rtl .nav{direction:rtl}
body.rtl .brand{letter-spacing:1px}
body.rtl .mobile-menu{direction:rtl}
body.rtl .close-menu{right:auto;left:20px}

/* MOBILE */
@media(max-width:900px){
 .navlinks{display:none}
 .menu-btn{display:block}
 .hero-decoration{opacity:.2;right:-65px}
 .grid,.news-grid{grid-template-columns:repeat(2,1fr)}
 .feature{grid-template-columns:1fr}
}
@media(max-width:600px){
 section{padding:65px 0}
 .nav{min-height:70px}
 .brand{font-size:18px}
 .logo{width:36px;height:36px}
 .mobile-menu{top:70px}
 .grid,.news-grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .hero{min-height:550px;padding:70px 0}
 .hero h1{letter-spacing:-2px}
 .hero p{font-size:16px}
 .contact-box{padding:25px}
 .feature-art{min-height:230px}
}
</style>
</head>

/* LANGUAGE SYSTEM */
const languageSelect=document.getElementById("language");

function changeLanguage(lang){
 const dict=translations[lang] || translations.ru;

 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.classList.toggle("rtl",lang==="ar");

 document.querySelectorAll("[data-t]").forEach(element=>{
  const key=element.dataset.t;
  element.textContent=dict[key] ?? translations.en[key] ?? "";
 });

 languageSelect.value=lang;
 try{localStorage.setItem("aura-language",lang)}catch(e){}
}

languageSelect.addEventListener("change",()=>{
 changeLanguage(languageSelect.value);
});

/* MENU SYSTEM */
const menu=document.getElementById("mobileMenu");
const menuBtn=document.getElementById("menuBtn");
const closeBtn=document.getElementById("closeMenu");

function closeMenu(){
 menu.classList.remove("open");
 menuBtn.setAttribute("aria-expanded","false");
}

function openMenu(){
 menu.classList.add("open");
 menuBtn.setAttribute("aria-expanded","true");
}

menuBtn.addEventListener("click",()=>{
 if(menu.classList.contains("open"))closeMenu();
 else openMenu();
});

closeBtn.addEventListener("click",closeMenu);

/* Automatically close after choosing a section */
document.querySelectorAll(".mobile-menu a").forEach(link=>{
 link.addEventListener("click",closeMenu);
});

/* Close when tapping outside the menu */
document.addEventListener("click",event=>{
 if(!menu.contains(event.target)&&
    !menuBtn.contains(event.target)){
  closeMenu();
 }
});

/* Close with Escape */
document.addEventListener("keydown",event=>{
 if(event.key==="Escape")closeMenu();
});

/* Close when scrolling */
window.addEventListener("scroll",()=>{
 if(menu.classList.contains("open"))closeMenu();
},{passive:true});

/* Close when changing to desktop layout */
window.addEventListener("resize",()=>{
 if(window.innerWidth>900)closeMenu();
});

/* INITIAL LANGUAGE */
let savedLanguage="ru";
try{
 savedLanguage=localStorage.getItem("aura-language")||"ru";
}catch(e){}
changeLanguage(translations[savedLanguage]?savedLanguage:"ru");
</script>
